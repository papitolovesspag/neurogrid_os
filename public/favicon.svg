<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>
    <linearGradient id="wave1Grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="wave2Grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00FF9D" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="cellBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Energy Cell Background -->
  <polygon points="32,5 57,19 57,45 32,59 7,45 7,19" fill="url(#cellBg)" stroke="url(#hexGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Concentric Circuit Hex -->
  <polygon points="32,12 50,23 50,41 32,52 14,41 14,23" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="3,3" />

  <!-- Dual Wave Frequencies -->
  <!-- Primary High-Frequency Pulse -->
  <path d="M12,32 C18,22 22,42 28,32 C32,24 36,39 42,32 C46,27 50,35 52,32" fill="none" stroke="url(#wave1Grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Secondary Phase-Synchronized Harmonic Wave -->
  <path d="M12,32 C17,39 23,24 29,32 C33,38 37,25 43,32 C47,36 49,28 52,32" fill="none" stroke="url(#wave2Grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Central Synaptic Node -->
  <circle cx="32" cy="32" r="2.5" fill="#00FF9D" filter="url(#glow)" />
  <circle cx="32" cy="32" r="1" fill="#FFFFFF" />
</svg>
